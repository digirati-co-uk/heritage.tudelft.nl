summary:
  en: ["<span>The Museum Collection includes objects that draw on TU Delft's institutional history, academic education and research. The items range from measuring instruments, course material, demonstration devices and research collections, to art, such as professorial portraits. The collection contains around 6,500 objects. Objects can be loaned under museum conditions for public exhibitions hosted on or off the campus. A complete inventory will be gradually published here; currently two subcollecties can be viewed online. Please contact <b>TU Delft Library</b> for more information about the collection</span>"]
