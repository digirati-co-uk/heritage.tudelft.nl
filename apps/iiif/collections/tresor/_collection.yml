label:
  en: ["Trésor"]
  nl: ["Trésor"]
background: "#3b82f6"
summary:
  en:
    - >-
      The Trésor includes historic books, journals, maps, photographs and prints from before 1900.
      Their age, rarity, value or vulnerability is what makes them special.
      The Trésor also collects TU Delft output that is not usually included in academic journals, such as speeches, dissertations and lecture notes.
      Digitised objects from the collection can be found in multiple locations: the separate <a href="https://tresor.tudelft.nl">Trésor website</a>,
      <a href="https://repository.tudelft.nl/islandora/search/?collection=research">Research Repository</a>,
      <a href="https://repository.tudelft.nl/search/MMP/?q=set%3Aprentenkabinet">Image Archive</a>,
      and the <a href="http://www.colonialarchitecture.eu">Colonial Architecture &amp; Town Planning Repository</a>.
      The dispersed material will be gradually brought together on this website.
