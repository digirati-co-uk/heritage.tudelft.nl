server:
  url: http://localhost:3000/iiif

builtInScripts: true
output:
  # Preserve shared topic URLs for Delft's spelling and punctuation variants.
  topicSlugCollisions: merge

# Every step is owned by Delft in ./scripts.
run:
  - extract-runtime-hints
  - flat-manifests
  - delft-labels
  - extract-remote-source
  - extract-slug-source
  - delft-extract-labels
  - extract-part-of-collection
  - extract-thumbnail-local
  - extract-files-list
  - enrich-files-rewrite
  - manifest-sqlite
  - metadata-analysis
  - site-collections
  - delft-image-source
  - extract-search-record
  - delft-test-extract-schema
  - extract-collection-thumbnail
  - featured-part-of
  - collection-item-order
  - collection-thumbnail
search:
  indexNames: ["manifests"]
  defaultIndex: manifests
  emitRecord: true

collections:
  hydrate:
    - collections/museumcollectie
    - collections/tresor
    - collections/andere-collecties
  index:
    label: { "en": ["TU Delft Academic Heritage"], "nl": ["Academisch Erfgoed TU Delft"] }
  featured:
    label: { "en": ["Collections"], "nl": ["Collecties"] }
    summary: { "en": ["Explore the academic heritage of TU Delft — museum objects, rare books, maps, photographs, and scientific
            instruments spanning 180 years of history."], "nl": ["Ontdek het academisch erfgoed van de TU Delft — museumobjecten, zeldzame boeken, kaarten, foto's en wetenschappelijke instrumenten die 180 jaar geschiedenis omspannen."] }
    items:
      - collections/museumcollectie
      - collections/tresor
      - collections/andere-collecties

config:
  extract-thumbnail-local:
    width: 1080
    height: 1080

  featured-part-of:
    searchRecords: true

  extract-files-list:
    fileTemplates:
      schema.json:
        _injectId: '@id'
        type: "Dataset"
        format: "application/json"
        label: "Product Schema"
        property: seeAlso

stores:
  new-collections:
    type: iiif-json
    path: "./collections"
    pattern: "**/*.{json,yaml,yml}"


  collective-access:
    type: iiif-json
    path: ./manifests/collective-access
    destination: manifests
    subFiles: true
    pattern: "**/*.{json,yaml,yml}"
    run:
      - extract-topics
      - delft-related
    config:
      extract-topics:
        commaSeparated: ["material"]
        dateRange: ["date"]
        topicTypes:
          material: ["Materiaal", "Material"]
          date: ["Date", "Datering"]
          contributor: ["Maker"]
          format: ["Objectnaam"]

  dlcs:
    type: iiif-json
    path: ./manifests/dlcs
    destination: manifests
    pattern: "**/*.{json,yaml,yml}"
    run:
      - extract-topics
      - folder-collections
    config:
      extract-topics:
        topicTypes:
          date: ["Year"]
          format: ["Format"]
          contributor: ["Contributor", "Contributors"]

  manifest-editor:
    type: iiif-json
    path: ./manifests/manifest-editor
    destination: manifests
    pattern: "**/*.{json,yaml,yml}"
    run:
      - folder-collections

  projects:
    type: iiif-json
    path: ./manifests/projects
    destination: manifests
    pattern: "**/*.{json,yaml,yml}"
    run:
      - folder-collections
